<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nihongo Ears</title>
  <meta name="description" content="A personal Japanese speaking and listening trainer: romaji, audio-first, spaced repetition.">
  <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nihongo">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1 class="brand"><span class="dot" aria-hidden="true"></span>Nihongo Ears</h1>
    <span id="streak-pill" class="pill" title="Day streak"></span>
  </header>

  <main id="view" tabindex="-1" aria-live="polite"></main>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="home"   aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button data-tab="learn"  aria-label="Learn"><svg viewBox="0 0 24 24"><path d="M4 5h11a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3zM18 8h2v13H7"/></svg><span>Learn</span></button>
    <button data-tab="review" aria-label="Review"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg><span>Review</span><i id="due-badge" class="badge" hidden></i></button>
    <button data-tab="speak"  aria-label="Speak"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>Speak</span></button>
    <button data-tab="life"   aria-label="Real life"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></svg><span>Real life</span></button>
  </nav>

  <noscript><p class="wrap">This app needs JavaScript turned on.</p></noscript>
  <script src="app.js" type="module"></script>
</body>
</html>
