# Publishes the app to GitHub Pages. Pull requests run the check and build the
# site artifact; only a push to main (or a manual run) deploys it.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cut a running deploy short; a superseded PR run can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check
        run: node scripts/check.mjs
      - name: Stage the site
        # Only the app ships: docs, scripts and repo tooling stay out of the public site.
        run: |
          mkdir _site
          cp -R index.html app.js styles.css sw.js content.json manifest.webmanifest icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
